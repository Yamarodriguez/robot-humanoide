# Configuración de despliegue en Netlify.
# Netlify lee este archivo del repositorio: no hay que tocar nada en su panel.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Se fija la versión de Node para que la build sea reproducible.
  NODE_VERSION = "22"

# Cabeceras de seguridad razonables para un sitio estático.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Los recursos con hash en el nombre no cambian nunca: caché larga.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/wp-content/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
